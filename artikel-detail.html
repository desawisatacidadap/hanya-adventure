<script>
async function loadArticle(){
  const params = new URLSearchParams(window.location.search);
  const slug = params.get('slug');
  const el = document.getElementById('articleContent');

  if (!slug) { el.innerHTML = '<div class="art-notfound">Artikel tidak ditemukan. <br><a href="artikel.html" style="color:var(--lime)">&larr; Kembali ke daftar artikel</a></div>'; return; }

  const { data, error } = await supabaseClient
    .from('articles')
    .select('*')
    .eq('slug', slug)
    .eq('published', true)
    .single();

  if (error || !data) {
    el.innerHTML = '<div class="art-notfound">Artikel tidak ditemukan atau belum dipublikasikan. <br><a href="artikel.html" style="color:var(--lime)">&larr; Kembali ke daftar artikel</a></div>';
    return;
  }

  document.title = data.title + ' | Hanya Adventure Puncak Bogor';
  document.getElementById('pageDesc').setAttribute('content', data.excerpt || data.title);

  const paragraphs = data.content.split('\n').filter(p => p.trim()).map(p => `<p>${escapeHtml(p)}</p>`).join('');

  el.innerHTML = `
    <a href="artikel.html" class="art-back">&#8592; Semua Artikel</a>
    ${data.cover_image ? `<img src="${escapeHtml(data.cover_image)}" alt="${escapeHtml(data.title)}" class="art-detail-cover">` : ''}
    <div class="art-detail-date">${formatDate(data.created_at)}</div>
    <h1 class="art-detail-title">${escapeHtml(data.title)}</h1>
    <div class="art-detail-content">${paragraphs}</div>
    <div style="margin-top:2.5rem;padding-top:1.5rem;border-top:1px solid #e5ddd0">
      <a href="https://wa.me/6287874010019?text=Halo%20Hanya%20Adventure!%20Saya%20habis%20baca%20artikel%20tentang%20${encodeURIComponent(data.title)}" style="display:inline-flex;align-items:center;gap:0.5rem;background:var(--lime);color:#fff;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:0.85rem;text-transform:uppercase;padding:0.75rem 1.5rem;border-radius:5px">&#128172; Tanya-tanya di WhatsApp</a>
    </div>
  `;
}

function escapeHtml(str){
  if (!str) return '';
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}
function formatDate(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('id-ID', { day:'numeric', month:'long', year:'numeric' });
}

loadArticle();
</script>
